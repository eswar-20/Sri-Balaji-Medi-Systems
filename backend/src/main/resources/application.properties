# Database Configuration (fallback values if env vars not set)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:medical_equipment}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Manoj@2004}


# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=true

# Server Configuration
server.port=${SERVER_PORT:8080}

# JWT Configuration
jwt.secret=${JWT_SECRET:yourSecretKey12345yourSecretKey12345yourSecretKey12345}
jwt.expiration=${JWT_EXPIRATION:86400}

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://sri-balaji-medi-frontend.onrender.com}

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_SriBalajiKeyId123}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:SriBalajiSecretKeySecret456}

# Brevo Email API Configuration
brevo.api.key=${BREVO_API_KEY:}

# HikariCP Connection Pool Optimization for Performance & Low Latency
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=60000

# Web Server Optimization & Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024